    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Connections Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; user-select: none; }
        .card.selected { background-color: #334155; color: white; transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .solved-tile { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .grid-container { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    </style>
</head>

    <div class="max-w-3xl w-full text-center mb-6">
        <h1 class="text-4xl font-bold text-slate-900 mb-2">Word Connections Master</h1>
        <p id="level-display" class="text-lg text-slate-600 font-semibold">Level 1</p>
    </div>

    <div id="game-board" class="grid-container w-full max-w-4xl bg-white p-4 rounded-3xl shadow-sm border border-slate-200">
        <!-- JS will populate cards -->
    </div>

    <div id="message-area" class="mt-6 text-center text-slate-700 font-medium h-12 w-full max-w-lg px-4 italic"></div>

    <div class="mt-8 flex flex-wrap justify-center gap-4">
        <button id="submit-btn" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-700 transition transform hover:scale-105 active:scale-95 shadow-lg">Submit Group</button>
        <button id="hint-btn" class="bg-indigo-100 text-indigo-700 px-8 py-3 rounded-2xl font-bold hover:bg-indigo-200 transition transform hover:scale-105 active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">Hint</button>
        <button id="next-level-btn" class="hidden bg-emerald-600 text-white px-8 py-3 rounded-2xl font-bold hover:bg-emerald-700 transition transform hover:scale-105 active:scale-95 shadow-lg">Next Level</button>

            ["Detective", "Magnifying", "Clues", "Mystery", "Suspect", "Logic"],
            ["Fantasy Forest", "Pixies", "Glowing", "Ancient", "Roots", "Enchantment"],
            ["Celestial", "Moon", "Constellations", "Eclipse", "Orbit", "Infinite"],
            ["Time Travel", "Paradox", "History", "Future", "Vortex", "Clock"],
            ["Supernatural", "Powers", "Occult", "Energy", "Ghosts", "Rituals"],
            ["Horror", "Scream", "Dark", "Suspense", "Terror", "Blood"],
            ["Romance", "Passion", "Heart", "Letters", "Roses", "Embrace"],
            ["Adventure", "Map", "Compass", "Journey", "Peril", "Discovery"],
            ["Action", "Explosions", "Speed", "Chase", "Combat", "Intensity"],
            ["Western", "Sunset", "Pistol", "Dusty", "Spurs", "Desert"],
            ["Space Opera", "Empires", "Ships", "Lasers", "Aliens", "Alliances"],
            ["Dystopia", "Control", "Scarcity", "Ruins", "Rebellion", "Fear"],
            ["Utopia", "Harmony", "Peace", "Garden", "Light", "Equality"],
            ["Gothic", "Velvet", "Moody", "Stone", "Lace", "Melancholy"],
            ["Noir", "Smoke", "Hat", "Shadows", "Rain", "Betrayal"],
            ["Minimalist", "Clean", "Simple", "Space", "White", "Essential"],
            ["Maximalist", "Clutter", "Vibrant", "Bold", "Layers", "Texture"],
            ["Bohemian", "Beads", "Patterns", "Rugs", "Plants", "Flow"],
            ["Rustic", "Wood", "Stone", "Raw", "Farm", "Aged"],
            ["Modern", "Sleek", "Glass", "Steel", "Functional", "Design"],
            ["Zen", "Calm", "Sand", "Rock", "Meditate", "Stillness"],
            ["Coastal", "Blue", "Shells", "Breeze", "Salt", "Cottage"],
            ["Royal", "Crown", "Throne", "Velvet", "Banquet", "Palace"],
            ["Circus", "Acrobat", "Rings", "Lion", "Tent", "Spectacle"],
            ["Space Colony", "Dome", "Hydroponics", "Rovers", "Air", "Settlement"],
            ["Volcano Island", "Jungle", "Lava", "Heat", "Tribe", "Eruption"],
            ["Deep Sea", "Bioluminescence", "Pressure", "Trench", "Squid", "Dark"],
            ["Medieval Siege", "Ramparts", "Arrows", "Catapult", "Wall", "Armor"],
            ["Space Horror", "Isolated", "Vents", "Metal", "Oxygen", "Creature"],
            ["Jazz Age", "Flapper", "Saxophone", "Dance", "Party", "Gin"],
            ["Post-Apocalyptic", "Scavenge", "Rubble", "Sun", "Survival", "Nomad"],
            ["Candy World", "Sweet", "Sugar", "Swirl", "Colorful", "Treats"],
            ["Underwater City", "Dome", "Glass", "Bubbles", "Fish", "Currents"],
            ["Floating Islands", "Clouds", "Gravity", "Bridge", "Sky", "Birds"],
            ["Ancient Rome", "Toga", "Marble", "Arena", "Empire", "Columns"],
            ["Samurai", "Katana", "Honor", "Cherry", "Tea", "Disciplined"],
            ["Viking", "Ship", "Axe", "Sea", "Raid", "Furs"]
        ];

        const fullLibrary = rawData.map((item, index) => ({
            name: item[0],
            color: colors[index % colors.length],
            words: item.slice(1, 6) // Ensures exactly 5 words per theme
        }));

        let currentLevel = 1;
        let activeItems = [];
        let solvedCategories = [];
        let selectedWords = [];
        let hintCooldown = false;

        function initLevel() {
            const shuffledIndices = Array.from({length: fullLibrary.length}, (_, i) => i).sort(() => Math.random() - 0.5);
            const levelCategories = shuffledIndices.slice(0, 5).map(i => fullLibrary[i]);
            
            activeItems = [];
            levelCategories.forEach(cat => {
                cat.words.forEach(word => {
                    activeItems.push({ id: Math.random(), word, category: cat.name, color: cat.color });
                });
            });
            activeItems.sort(() => Math.random() - 0.5);
            
            solvedCategories = [];
            selectedWords = [];
            document.getElementById('level-display').textContent = `Level ${currentLevel}`;
            document.getElementById('next-level-btn').classList.add('hidden');
            document.getElementById('message-area').textContent = '';
            render();
        }

        function render() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            
            solvedCategories.forEach(cat => {
                const div = document.createElement('div');
                div.className = `solved-tile h-24 md:h-32 ${cat.color} rounded-2xl flex flex-col items-center justify-center text-white font-bold text-center shadow-lg col-span-1 p-2 border-4 border-white/20`;
                div.innerHTML = `<span class="text-[9px] md:text-xs opacity-75 uppercase tracking-widest">Unlocked</span><span class="text-xs md:text-base leading-tight mt-1 px-1">${cat.name}</span>`;
                board.appendChild(div);
            });

            activeItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `card h-24 md:h-32 bg-white hover:bg-slate-50 rounded-2xl flex items-center justify-center font-bold text-slate-800 text-xs md:text-sm border-2 border-slate-200 select-none ${selectedWords.includes(item) ? 'selected' : ''}`;
                div.textContent = item.word;
                div.onclick = () => toggleSelection(item);
                board.appendChild(div);
            });
        }

        function toggleSelection(item) {
            if (selectedWords.includes(item)) {
                selectedWords = selectedWords.filter(w => w !== item);
            } else if (selectedWords.length < 5) {
                selectedWords.push(item);
            }
            render();
        }

        document.getElementById('submit-btn').onclick = () => {
            if (selectedWords.length !== 5) {
                document.getElementById('message-area').textContent = 'Please select exactly 5 words.';
                return;
            }
            
            const firstCategory = selectedWords[0].category;
            const isAllSame = selectedWords.every(item => item.category === firstCategory);
            
            if (isAllSame) {
                solvedCategories.push({ name: firstCategory, color: selectedWords[0].color });
                activeItems = activeItems.filter(item => item.category !== firstCategory);
                selectedWords = [];
                
                if (activeItems.length === 0) {
                    document.getElementById('next-level-btn').classList.remove('hidden');
                    document.getElementById('message-area').textContent = 'Level Completed! Great job!';
                } else {
                    document.getElementById('message-area').textContent = 'Correct group found!';
                }
                render();
            } else {
                const board = document.getElementById('game-board');
                board.classList.add('animate-pulse');
                document.getElementById('message-area').textContent = 'Not a match, try again.';
                setTimeout(() => board.classList.remove('animate-pulse'), 500);
            }
        };

        document.getElementById('hint-btn').onclick = () => {
            if (hintCooldown || activeItems.length === 0) return;
            
            const randomItem = activeItems[Math.floor(Math.random() * activeItems.length)];
            document.getElementById('message-area').textContent = `Hint: '${randomItem.word}' belongs to the theme '${randomItem.category}'.`;
            
            startHintCooldown();
        };

        function startHintCooldown() {
            hintCooldown = true;
            const hintBtn = document.getElementById('hint-btn');
            let timeLeft = 30;
            
            hintBtn.disabled = true;
            hintBtn.textContent = `Hint (${timeLeft}s)`;
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    hintBtn.textContent = `Hint (${timeLeft}s)`;
                } else {
                    clearInterval(timer);
                    hintCooldown = false;
                    hintBtn.disabled = false;
                    hintBtn.textContent = 'Hint';
                }
            }, 1000);
        }

        document.getElementById('next-level-btn').onclick = () => {
            currentLevel++;
            initLevel();
        };

        document.getElementById('reset-btn').onclick = initLevel;

        window.onload = initLevel;
    </script>
